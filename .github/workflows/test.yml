name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The browsers are installed explicitly a step further down, so the postinstall does not
      # download a second copy of them here.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Real Google Chrome, not bundled Chromium, because several tests turn on measured pixel
      # values — an `<input style="width:0">` reports 7.2px and a checkbox 13px, and the rule
      # that separates a real control from a honeypot sits between those two numbers. Running
      # the same engine as a developer's machine keeps that honest.
      # Plus Playwright's own Chromium for tests/extension.spec.ts only: branded Chrome stopped
      # loading unpacked extensions from the command line in version 137.
      - name: Install Chrome
        run: npx playwright install --with-deps chrome chromium

      # Build first. Next generates types into `.next/types` that the app's own tsconfig
      # includes, so on a clean checkout anything depending on them does not exist yet — which
      # is how CI's first run failed while the same command passed locally against a stale
      # `.next`. Nothing in `src/` relies on those types any more, and this ordering keeps it
      # that way for whatever gets written next.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds the probe bundle first, so the suite always runs the real `core/`
      # rather than a stale copy of it.
      - name: Test
        run: npm test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Real forms from other sites, replayed offline from the private corpus repo, scored against
  # their verified truth. Fails when any form reads worse than `baseline.json`, or a honeypot
  # becomes something the model can fill.
  #
  # The key is a read-only deploy key on longtake-corpus. A fork's pull request has no secrets,
  # so there the job says why it has nothing to score and passes.
  #
  # This repo is public and so are its logs: the report here is numbers and form ids only
  # (`CORPUS_REPORT_DETAILS=off`), and nothing is uploaded — a trace holds a copy of the page.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CORPUS: ${{ secrets.CORPUS_DEPLOY_KEY != '' }}
      CORPUS_REPORT_DETAILS: "off"

    steps:
      - uses: actions/checkout@v4

      - name: Check out the private corpus
        if: env.HAS_CORPUS == 'true'
        uses: actions/checkout@v4
        with:
          repository: rohit-jsfreaky/longtake-corpus
          ssh-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
          path: corpus
          persist-credentials: false

      - name: No corpus here
        if: env.HAS_CORPUS != 'true'
        run: echo "No CORPUS_DEPLOY_KEY secret, so no private corpus to score — skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: env.HAS_CORPUS == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.HAS_CORPUS == 'true'
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Chrome
        if: env.HAS_CORPUS == 'true'
        run: npx playwright install --with-deps chrome

      # Builds the probe bundle, replays every form, scores it, then writes the report — to this
      # run's summary page — and compares it with the baseline.
      - name: Score the corpus
        if: env.HAS_CORPUS == 'true'
        run: npm run corpus
